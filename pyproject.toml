[project]
name = "kwb-n2o"
version = "0.1.0"
description = "Estimation of N2O emissions from aerated zones of activated-sludge tanks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "more-itertools>=11.2.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-calamine>=0.8.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
